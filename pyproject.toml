[project]
name = "football-quant-intelligence"
version = "0.1.0"
description = "Quantitative football intelligence MVP for Asian handicap research, backtesting, risk, and AI explanations."
requires-python = ">=3.11"
dependencies = ["scikit-learn"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
